<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kayıtlar — IT Panosu</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth.js"></script>
  <style>
    .lg-ozet { display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:1rem; margin-bottom:1.25rem; }
    .lg-filtre { display:flex; flex-wrap:wrap; gap:.75rem; align-items:flex-end; background:var(--kart); padding:1rem; border-radius:12px; margin-bottom:1rem; }
    .lg-alan { display:flex; flex-direction:column; gap:.3rem; }
    .lg-alan label { font-size:.75rem; color:#8b949e; }
    .lg-filtre input, .lg-filtre select { background:var(--bg); border:1px solid rgba(255,255,255,.12); color:var(--metin); border-radius:8px; padding:.55rem .7rem; font-size:.9rem; font-family:inherit; }
    .lg-filtre input:focus, .lg-filtre select:focus { outline:none; border-color:var(--vurgu); }
    .lg-filtre input[type=date] { color-scheme:dark; }
    .lg-btn { background:var(--vurgu); color:#04121f; border:none; border-radius:8px; padding:.6rem 1rem; font-size:.9rem; font-weight:600; cursor:pointer; }
    .lg-btn.ikincil { background:transparent; color:var(--metin); border:1px solid rgba(255,255,255,.2); font-weight:500; }
    .lg-btn:hover { opacity:.88; }
    .lg-btn:disabled { opacity:.35; cursor:default; }
    .lg-arac { display:flex; flex-wrap:wrap; gap:.6rem; align-items:center; justify-content:space-between; margin-bottom:.75rem; }
    .lg-arac .sag { display:flex; gap:.6rem; align-items:center; flex-wrap:wrap; }
    .lg-bilgi { color:#8b949e; font-size:.85rem; }
    .lg-otomatik { font-size:.85rem; color:#8b949e; display:flex; gap:.35rem; align-items:center; cursor:pointer; }
    .lg-tablo-kap { overflow-x:auto; background:var(--kart); border-radius:12px; }
    .lg-tablo { width:100%; border-collapse:collapse; font-size:.9rem; }
    .lg-tablo th, .lg-tablo td { padding:.7rem 1rem; text-align:left; border-bottom:1px solid rgba(255,255,255,.06); }
    .lg-tablo th { font-size:.75rem; text-transform:uppercase; letter-spacing:.04em; color:#8b949e; font-weight:600; cursor:pointer; user-select:none; white-space:nowrap; }
    .lg-tablo th:hover, .lg-tablo th.aktif { color:var(--metin); }
    .lg-tablo td.zaman { white-space:nowrap; color:#c9d1d9; }
    .lg-tablo td.detay { font-family:ui-monospace,Menlo,monospace; font-size:.85rem; color:#c9d1d9; word-break:break-word; }
    .lg-tablo tbody tr:hover { background:rgba(255,255,255,.03); }
    .cip { display:inline-block; font-size:.75rem; font-weight:600; padding:.2rem .6rem; border-radius:999px; white-space:nowrap; }
    .cip.genel-bakis { color:#4aa8ff; background:rgba(74,168,255,.12); }
    .cip.sunucular { color:#3ecf7a; background:rgba(62,207,122,.12); }
    .cip.subnet { color:#e3b341; background:rgba(227,179,65,.12); }
    .cip.kayitlar { color:#bc8cff; background:rgba(188,140,255,.12); }
    .cip.giris { color:#8b949e; background:rgba(139,148,158,.14); }
    .cip.bakim { color:#ff7b72; background:rgba(255,123,114,.12); }
    .lg-bos { padding:2rem; text-align:center; color:#8b949e; }
    .lg-hata { padding:2rem; text-align:center; color:#f85149; }
    .lg-sayfa { display:flex; gap:.75rem; align-items:center; justify-content:flex-end; margin-top:.75rem; }
    .deger.kucuk { font-size:1.05rem; }
  </style>
</head>
<body>
  <header>
    <span class="logo" title="DaVinci Teknoloji"></span>
    <h1>Kayıt Görüntüleyici</h1>
    <nav>
      <a href="index.html">Genel Bakış</a>
      <a href="sunucular.html">Sunucular</a> <a href="subnet.html">Subnet Hesaplama</a> <a href="kayitlar.html" class="active">Kayıtlar</a> <a href="bakim.html">Bakım Anlaşmaları</a>
    </nav>
    <span id="saat" class="saat"></span>
  </header>
  <main>
    <section class="lg-ozet">
      <div class="kart"><h2>Toplam Olay</h2><p class="deger" id="stToplam">–</p></div>
      <div class="kart"><h2>Bugün</h2><p class="deger" id="stBugun">–</p></div>
      <div class="kart"><h2>Son Olay</h2><p class="deger kucuk" id="stSon">–</p></div>
    </section>

    <div class="lg-filtre">
      <div class="lg-alan"><label for="fSayfa">Sekme</label>
        <select id="fSayfa">
          <option value="">Tümü</option>
          <option value="genel-bakis">Genel Bakış</option>
          <option value="sunucular">Sunucular</option>
          <option value="subnet">Subnet Hesaplama</option>
          <option value="kayitlar">Kayıtlar</option>
          <option value="bakim">Bakım Anlaşmaları</option>
          <option value="giris">Giriş</option>
        </select></div>
      <div class="lg-alan"><label for="fOlay">Olay</label>
        <select id="fOlay">
          <option value="">Tümü</option>
          <option>Sayfa görüntülendi</option>
          <option>Buton tıklandı</option>
          <option>Ayar değiştirildi</option>
          <option>Durum yenilendi</option>
          <option>Kullanıcı sayısı güncellendi</option>
          <option>Hesaplama</option>
          <option>Değer kopyalandı</option>
          <option>Kopyalama başarısız</option>
          <option>Geçmiş temizlendi</option>
          <option>CSV indirildi</option>
          <option>Giriş yapıldı</option>
          <option>Giriş başarısız</option>
          <option>Çıkış yapıldı</option>
          <option>Oturum zaman aşımı</option>
          <option>Anlaşma eklendi</option>
          <option>Anlaşma güncellendi</option>
          <option>Anlaşma silindi</option>
          <option>Anlaşma görüntülendi</option>
          <option>Dosya açıldı</option>
        </select></div>
      <div class="lg-alan"><label for="fDetay">Detay (içerir)</label><input id="fDetay" type="text" placeholder="ör. 192.168 veya web-01" size="18"></div>
      <div class="lg-alan"><label for="fBas">Başlangıç</label><input id="fBas" type="date"></div>
      <div class="lg-alan"><label for="fBit">Bitiş</label><input id="fBit" type="date"></div>
      <button class="lg-btn" id="uygula">Filtrele</button>
      <button class="lg-btn ikincil" id="sifirla">Sıfırla</button>
    </div>

    <div class="lg-arac">
      <span class="lg-bilgi" id="bilgi">Yükleniyor…</span>
      <div class="sag">
        <label class="lg-otomatik"><input type="checkbox" id="oto"> 30 sn'de bir yenile</label>
        <button class="lg-btn ikincil" id="yenileBtn">Yenile</button>
        <button class="lg-btn ikincil" id="csvBtn">CSV indir</button>
      </div>
    </div>

    <div class="lg-tablo-kap">
      <table class="lg-tablo">
        <thead><tr>
          <th data-alan="created_at">Zaman</th>
          <th data-alan="sayfa">Sekme</th>
          <th data-alan="olay">Olay</th>
          <th data-alan="detay">Detay</th>
        </tr></thead>
        <tbody id="govde"></tbody>
      </table>
    </div>

    <div class="lg-sayfa">
      <button class="lg-btn ikincil" id="onceki">‹ Önceki</button>
      <span class="lg-bilgi" id="sayfaBilgi"></span>
      <button class="lg-btn ikincil" id="sonraki">Sonraki ›</button>
    </div>
  </main>
  <script src="js/log.js"></script>
  <script src="js/app.js"></script>
  <script>
  // ---- Supabase bağlantısı (salt okunur görüntüleme) ----
  const SB = 'https://ayxjajcymhqslanqkpqd.supabase.co/rest/v1/olay_log';
  const KEY = 'sb_publishable_ZAzI-b38n2eGkgY97LnFOQ_dhe4XUrr'; // herkese açık (publishable) anahtar
  const SAYFA_BOYU = 25;
  const SEKME_AD = { 'genel-bakis': 'Genel Bakış', 'sunucular': 'Sunucular', 'subnet': 'Subnet Hesaplama', 'kayitlar': 'Kayıtlar', 'bakim': 'Bakım Anlaşmaları', 'giris': 'Giriş' };
  let sayfa = 0, toplam = 0, siralaAlan = 'created_at', artan = false, otoZamanlayici = null;

  const $ = id => document.getElementById(id);
  const basliklar = (ek) => window.yetkiBasliklari(ek); // giriş yapan kullanıcının kimliğiyle

  function kacis(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function zaman(iso) { return new Date(iso).toLocaleString('tr-TR'); }

  // Filtreleri Supabase (PostgREST) sorgu parametrelerine çevir
  function filtreler() {
    const p = [];
    if ($('fSayfa').value) p.push('sayfa=eq.' + encodeURIComponent($('fSayfa').value));
    if ($('fOlay').value) p.push('olay=eq.' + encodeURIComponent($('fOlay').value));
    const d = $('fDetay').value.replace(/[^0-9A-Za-zÇĞİÖŞÜçğıöşü .\/:-]/g, '').trim();
    if (d) p.push('detay=ilike.' + encodeURIComponent('*' + d + '*'));
    if ($('fBas').value) p.push('created_at=gte.' + encodeURIComponent(new Date($('fBas').value + 'T00:00:00').toISOString()));
    if ($('fBit').value) p.push('created_at=lte.' + encodeURIComponent(new Date($('fBit').value + 'T23:59:59.999').toISOString()));
    return p;
  }
  function sorgu(ek) { return ek.length ? '&' + ek.join('&') : ''; }
  function sayimOku(r) {
    const cr = r.headers.get('content-range');
    return cr ? parseInt(cr.split('/')[1], 10) || 0 : 0;
  }

  async function yukle() {
    $('bilgi').textContent = 'Yükleniyor…';
    const url = SB + '?select=id,sayfa,olay,detay,created_at' + sorgu(filtreler())
      + '&order=' + siralaAlan + '.' + (artan ? 'asc' : 'desc') + ',id.desc'
      + '&limit=' + SAYFA_BOYU + '&offset=' + (sayfa * SAYFA_BOYU);
    try {
      const r = await fetch(url, { headers: basliklar({ Prefer: 'count=exact' }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const veri = await r.json();
      toplam = sayimOku(r);
      ciz(veri);
      $('bilgi').textContent = toplam.toLocaleString('tr-TR') + ' olay bulundu · güncellendi ' + new Date().toLocaleTimeString('tr-TR');
    } catch (e) {
      $('govde').innerHTML = '<tr><td colspan="4" class="lg-hata">Kayıtlar yüklenemedi (' + kacis(e.message) + ').</td></tr>';
      $('bilgi').textContent = 'Bağlantı hatası';
    }
    sayfaDurumu();
  }

  function ciz(veri) {
    if (!veri.length) {
      $('govde').innerHTML = '<tr><td colspan="4" class="lg-bos">Kayıt bulunamadı.</td></tr>';
      return;
    }
    $('govde').innerHTML = veri.map(k =>
      '<tr><td class="zaman">' + kacis(zaman(k.created_at)) + '</td>'
      + '<td><span class="cip ' + kacis(k.sayfa) + '">' + kacis(SEKME_AD[k.sayfa] || k.sayfa) + '</span></td>'
      + '<td>' + kacis(k.olay) + '</td>'
      + '<td class="detay">' + (k.detay ? kacis(k.detay) : '–') + '</td></tr>'
    ).join('');
  }

  function sayfaDurumu() {
    const toplamSayfa = Math.max(1, Math.ceil(toplam / SAYFA_BOYU));
    $('sayfaBilgi').textContent = 'Sayfa ' + (sayfa + 1) + ' / ' + toplamSayfa;
    $('onceki').disabled = sayfa === 0;
    $('sonraki').disabled = sayfa + 1 >= toplamSayfa;
  }

  function siralamaBasliklari() {
    document.querySelectorAll('.lg-tablo th').forEach(th => {
      const ad = th.textContent.replace(/ [▲▼]$/, '');
      const aktif = th.dataset.alan === siralaAlan;
      th.classList.toggle('aktif', aktif);
      th.textContent = ad + (aktif ? (artan ? ' ▲' : ' ▼') : '');
    });
  }

  async function ozet() {
    try {
      const bugun = new Date(); bugun.setHours(0, 0, 0, 0);
      const [rT, rB, rS] = await Promise.all([
        fetch(SB + '?select=id&limit=1', { headers: basliklar({ Prefer: 'count=exact' }) }),
        fetch(SB + '?select=id&limit=1&created_at=gte.' + encodeURIComponent(bugun.toISOString()), { headers: basliklar({ Prefer: 'count=exact' }) }),
        fetch(SB + '?select=created_at&order=created_at.desc&limit=1', { headers: basliklar() })
      ]);
      $('stToplam').textContent = sayimOku(rT).toLocaleString('tr-TR');
      $('stBugun').textContent = sayimOku(rB).toLocaleString('tr-TR');
      const son = await rS.json();
      $('stSon').textContent = son.length ? zaman(son[0].created_at) : 'Kayıt yok';
    } catch (e) {
      $('stToplam').textContent = $('stBugun').textContent = $('stSon').textContent = '?';
    }
  }

  function yenileHepsi() { yukle(); ozet(); }

  async function csvIndir() {
    const url = SB + '?select=created_at,sayfa,olay,detay' + sorgu(filtreler())
      + '&order=' + siralaAlan + '.' + (artan ? 'asc' : 'desc') + '&limit=5000';
    try {
      const r = await fetch(url, { headers: basliklar() });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      const veri = await r.json();
      const satirlar = [['Zaman', 'Sekme', 'Olay', 'Detay']]
        .concat(veri.map(k => [zaman(k.created_at), SEKME_AD[k.sayfa] || k.sayfa, k.olay, k.detay || '']));
      // Türkçe Excel için ; ayırıcı ve UTF-8 BOM
      const csv = '\uFEFF' + satirlar.map(s => s.map(h => '"' + String(h).replace(/"/g, '""') + '"').join(';')).join('\r\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
      a.download = 'olay-kayitlari-' + new Date().toISOString().slice(0, 10) + '.csv';
      document.body.appendChild(a); a.click(); a.remove();
      if (window.logYaz) logYaz('CSV indirildi', veri.length + ' kayıt');
    } catch (e) { alert('CSV oluşturulamadı: ' + e.message); }
  }

  // ---- Olaylar ----
  function filtrele() { sayfa = 0; yukle(); }
  $('uygula').addEventListener('click', filtrele);
  $('fDetay').addEventListener('keydown', e => { if (e.key === 'Enter') filtrele(); });
  $('sifirla').addEventListener('click', () => {
    $('fSayfa').value = ''; $('fOlay').value = ''; $('fDetay').value = ''; $('fBas').value = ''; $('fBit').value = '';
    filtrele();
  });
  $('onceki').addEventListener('click', () => { if (sayfa > 0) { sayfa--; yukle(); } });
  $('sonraki').addEventListener('click', () => { sayfa++; yukle(); });
  $('yenileBtn').addEventListener('click', yenileHepsi);
  $('csvBtn').addEventListener('click', csvIndir);
  $('oto').addEventListener('change', e => {
    clearInterval(otoZamanlayici);
    if (e.target.checked) otoZamanlayici = setInterval(yenileHepsi, 30000);
  });
  document.querySelectorAll('.lg-tablo th').forEach(th => {
    th.addEventListener('click', () => {
      if (siralaAlan === th.dataset.alan) artan = !artan;
      else { siralaAlan = th.dataset.alan; artan = siralaAlan !== 'created_at'; }
      sayfa = 0; siralamaBasliklari(); yukle();
    });
  });

  siralamaBasliklari();
  // Sayfa görüntüleme kaydı kısa bir gecikmeyle düşsün, sonra listeyi getir
  window.oturumHazir.then(() => setTimeout(yenileHepsi, 300));
  </script>
</body>
</html>
