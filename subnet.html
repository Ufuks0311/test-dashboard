<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Subnet Hesaplayıcı</title>
<style>
  :root {
    --bg:#0d1117; --kutu:#161b22; --kenar:#30363d; --metin:#e6edf3;
    --vurgu:#2dd4a7; --vurgu-koyu:#04231a; --etiket:#8b949e; --hata:#f85149;
    --ozel:#2dd4a7; --genel:#58a6ff; --ozel-bg:rgba(45,212,167,.12); --genel-bg:rgba(88,166,255,.12);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--metin); font-family:system-ui,-apple-system,sans-serif; min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:2rem 1rem; }
  .kutu { width:100%; max-width:560px; background:var(--kutu); border:1px solid var(--kenar); border-radius:16px; padding:1.75rem; box-shadow:0 8px 30px rgba(0,0,0,.35); }
  h1 { font-size:1.35rem; margin-bottom:.35rem; letter-spacing:-.02em; }
  .alt { color:var(--etiket); font-size:.9rem; margin-bottom:1.5rem; }
  .giris { display:flex; gap:.6rem; margin-bottom:1.25rem; flex-wrap:wrap; }
  input, select { background:var(--bg); border:1px solid var(--kenar); color:var(--metin); border-radius:9px; padding:.7rem .8rem; font-size:1rem; font-family:ui-monospace,Menlo,monospace; transition:border-color .15s; }
  input:focus, select:focus { outline:none; border-color:var(--vurgu); }
  input { flex:1; min-width:170px; }
  button.hesapla { background:var(--vurgu); color:var(--vurgu-koyu); border:none; border-radius:9px; padding:.7rem 1.4rem; font-size:1rem; font-weight:600; cursor:pointer; transition:opacity .15s; }
  button.hesapla:hover { opacity:.88; }
  .rozet { display:inline-flex; align-items:center; gap:.4rem; font-size:.8rem; font-weight:600; padding:.3rem .7rem; border-radius:999px; margin-bottom:1rem; }
  .rozet.ozel { color:var(--ozel); background:var(--ozel-bg); }
  .rozet.genel { color:var(--genel); background:var(--genel-bg); }
  .satir { display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.7rem 0; border-bottom:1px solid var(--kenar); }
  .satir:last-child { border-bottom:none; }
  .etiket { color:var(--etiket); font-size:.88rem; flex-shrink:0; }
  .sag { display:flex; align-items:center; gap:.5rem; min-width:0; }
  .deger { font-family:ui-monospace,Menlo,monospace; text-align:right; word-break:break-all; }
  .kopya { background:transparent; border:1px solid var(--kenar); color:var(--etiket); border-radius:6px; padding:.2rem .45rem; font-size:.75rem; cursor:pointer; flex-shrink:0; transition:all .15s; }
  .kopya:hover { border-color:var(--vurgu); color:var(--vurgu); }
  .kopya.ok { border-color:var(--vurgu); color:var(--vurgu); }
  .binary { font-size:.82rem; }
  .hata { color:var(--hata); padding:.7rem 0; }
</style>
</head>
<body>
  <div class="kutu">
    <h1>Subnet Hesaplayıcı</h1>
    <p class="alt">IP adresi ve prefix gir, ağ bilgilerini hesapla.</p>
    <div class="giris">
      <input id="ip" type="text" placeholder="192.168.1.10" value="192.168.1.10">
      <select id="prefix"></select>
      <button class="hesapla" id="hesapla">Hesapla</button>
    </div>
    <div id="rozet"></div>
    <div id="sonuc"></div>
  </div>
<script>
// Prefix seçeneklerini (/0 - /32) oluştur, varsayılan /24
const sel = document.getElementById('prefix');
for (let i = 0; i <= 32; i++) {
  const o = document.createElement('option');
  o.value = i; o.textContent = '/' + i;
  if (i === 24) o.selected = true;
  sel.appendChild(o);
}

function ipToInt(ip) {
  const parts = ip.trim().split('.');
  if (parts.length !== 4) return null;
  let n = 0;
  for (const p of parts) {
    if (!/^\d+$/.test(p)) return null;
    const v = parseInt(p, 10);
    if (v < 0 || v > 255) return null;
    n = n * 256 + v;
  }
  return n >>> 0;
}
function intToIp(n) {
  return [(n>>>24)&255, (n>>>16)&255, (n>>>8)&255, n&255].join('.');
}
function intToBinaryIp(n) {
  return [(n>>>24)&255, (n>>>16)&255, (n>>>8)&255, n&255]
    .map(o => o.toString(2).padStart(8, '0')).join('.');
}
function ipSinifi(o) {
  if (o < 128) return 'A';
  if (o < 192) return 'B';
  if (o < 224) return 'C';
  if (o < 240) return 'D (multicast)';
  return 'E (deneysel)';
}
// IP özel mi genel mi (RFC 1918 ve özel bloklar)
function ozelMi(ip) {
  const a = (ip>>>24)&255, b = (ip>>>16)&255;
  if (a === 10) return { tur:'ozel', ad:'Özel ağ (10.0.0.0/8)' };
  if (a === 172 && b >= 16 && b <= 31) return { tur:'ozel', ad:'Özel ağ (172.16.0.0/12)' };
  if (a === 192 && b === 168) return { tur:'ozel', ad:'Özel ağ (192.168.0.0/16)' };
  if (a === 127) return { tur:'ozel', ad:'Loopback (127.0.0.0/8)' };
  if (a === 169 && b === 254) return { tur:'ozel', ad:'Link-local (169.254.0.0/16)' };
  return { tur:'genel', ad:'Genel (public) adres' };
}

function hesapla() {
  const ip = ipToInt(document.getElementById('ip').value);
  const prefix = parseInt(document.getElementById('prefix').value, 10);
  const sonuc = document.getElementById('sonuc');
  const rozet = document.getElementById('rozet');
  if (ip === null) {
    rozet.innerHTML = '';
    sonuc.innerHTML = '<p class="hata">Geçersiz IP adresi. Örnek: 192.168.1.10</p>';
    return;
  }
  const mask = prefix === 0 ? 0 : (0xFFFFFFFF << (32 - prefix)) >>> 0;
  const wildcard = (~mask) >>> 0;
  const network = (ip & mask) >>> 0;
  const broadcast = (network | wildcard) >>> 0;
  const total = Math.pow(2, 32 - prefix);
  let ilk, son, kullanilabilir;
  if (prefix === 32) { ilk = son = intToIp(ip); kullanilabilir = 1; }
  else if (prefix === 31) { ilk = intToIp(network); son = intToIp(broadcast); kullanilabilir = 2; }
  else { ilk = intToIp((network+1)>>>0); son = intToIp((broadcast-1)>>>0); kullanilabilir = total - 2; }

  // Özel/genel rozeti
  const durum = ozelMi(ip);
  rozet.innerHTML = '<span class="rozet '+durum.tur+'">'+durum.ad+'</span>';

  // her satır: [etiket, değer, kopyalanabilir mi, ekstra sınıf]
  const satirlar = [
    ['Ağ adresi', intToIp(network) + '/' + prefix, true, ''],
    ['Broadcast adresi', intToIp(broadcast), true, ''],
    ['Alt ağ maskesi', intToIp(mask), true, ''],
    ['Wildcard maskesi', intToIp(wildcard), true, ''],
    ['İlk kullanılabilir host', ilk, true, ''],
    ['Son kullanılabilir host', son, true, ''],
    ['Kullanılabilir host sayısı', kullanilabilir.toLocaleString('tr-TR'), false, ''],
    ['Toplam adres', total.toLocaleString('tr-TR'), false, ''],
    ['IP sınıfı', ipSinifi((ip>>>24)&255), false, ''],
  ];
  sonuc.innerHTML = satirlar.map(s => {
    const dsinif = 'deger' + (s[3] ? ' ' + s[3] : '');
    const kopya = s[2] ? '<button class="kopya" data-deger="'+s[1]+'">kopyala</button>' : '';
    return '<div class="satir"><span class="etiket">'+s[0]+'</span>'
         + '<span class="sag"><span class="'+dsinif+'">'+s[1]+'</span>'+kopya+'</span></div>';
  }).join('');

  // kopyala düğmelerini bağla
  document.querySelectorAll('.kopya').forEach(btn => {
    btn.addEventListener('click', () => {
      const metin = btn.getAttribute('data-deger');
      navigator.clipboard.writeText(metin).then(() => {
        const eski = btn.textContent;
        btn.textContent = 'kopyalandı'; btn.classList.add('ok');
        setTimeout(() => { btn.textContent = eski; btn.classList.remove('ok'); }, 1200);
      }).catch(() => { btn.textContent = 'hata'; });
    });
  });
}

document.getElementById('hesapla').addEventListener('click', hesapla);
document.getElementById('ip').addEventListener('keydown', e => { if (e.key === 'Enter') hesapla(); });
hesapla(); // açılışta bir kez hesapla
</script>
</body>
</html>
