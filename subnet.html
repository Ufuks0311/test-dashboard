<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Subnet — IT Panosu</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .sn-kutu { max-width:560px; margin:0 auto; background:var(--kart); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:1.5rem; }
    .sn-alt { color:#8b949e; font-size:.9rem; margin-bottom:1.25rem; }
    .sn-giris { display:flex; gap:.6rem; margin-bottom:1.25rem; flex-wrap:wrap; }
    .sn-giris input, .sn-giris select { background:var(--bg); border:1px solid rgba(255,255,255,.12); color:var(--metin); border-radius:8px; padding:.7rem .8rem; font-size:1rem; font-family:ui-monospace,Menlo,monospace; }
    .sn-giris input:focus, .sn-giris select:focus { outline:none; border-color:var(--vurgu); }
    .sn-giris input { flex:1; min-width:170px; }
    .sn-hesapla { background:var(--vurgu); color:#04121f; border:none; border-radius:8px; padding:.7rem 1.4rem; font-size:1rem; font-weight:600; cursor:pointer; }
    .sn-hesapla:hover { opacity:.9; }
    .sn-rozet { display:inline-flex; align-items:center; font-size:.8rem; font-weight:600; padding:.3rem .7rem; border-radius:999px; margin-bottom:1rem; }
    .sn-rozet.ozel { color:var(--yesil); background:rgba(62,207,122,.12); }
    .sn-rozet.genel { color:var(--vurgu); background:rgba(74,168,255,.12); }
    .sn-satir { display:flex; align-items:center; justify-content:space-between; gap:.75rem; padding:.7rem 0; border-bottom:1px solid rgba(255,255,255,.08); }
    .sn-satir:last-child { border-bottom:none; }
    .sn-etiket { color:#8b949e; font-size:.88rem; flex-shrink:0; }
    .sn-sag { display:flex; align-items:center; gap:.5rem; min-width:0; }
    .sn-deger { font-family:ui-monospace,Menlo,monospace; text-align:right; word-break:break-all; }
    .sn-kopya { background:transparent; border:1px solid rgba(255,255,255,.15); color:#8b949e; border-radius:6px; padding:.2rem .45rem; font-size:.75rem; cursor:pointer; flex-shrink:0; }
    .sn-kopya:hover { border-color:var(--vurgu); color:var(--vurgu); }
    .sn-kopya.ok { border-color:var(--yesil); color:var(--yesil); }
    .sn-hata { color:#f85149; padding:.7rem 0; }
    .sn-gecmis { margin-top:1.5rem; border-top:1px solid rgba(255,255,255,.08); padding-top:1rem; }
    .sn-gecmis-baslik { display:flex; justify-content:space-between; align-items:center; margin-bottom:.6rem; }
    .sn-gecmis-baslik h3 { font-size:.95rem; font-weight:600; }
    .sn-temizle { background:transparent; border:1px solid rgba(255,255,255,.15); color:#8b949e; border-radius:6px; padding:.25rem .6rem; font-size:.75rem; cursor:pointer; }
    .sn-temizle:hover { border-color:#f85149; color:#f85149; }
    .sn-kayit { display:flex; justify-content:space-between; gap:.75rem; padding:.5rem .6rem; border-radius:6px; cursor:pointer; font-family:ui-monospace,Menlo,monospace; font-size:.85rem; }
    .sn-kayit:hover { background:rgba(255,255,255,.05); }
    .sn-kayit .zaman { color:#8b949e; font-family:system-ui,sans-serif; font-size:.75rem; flex-shrink:0; }
    .sn-bos { color:#8b949e; font-size:.85rem; }
  </style>
</head>
<body>
  <header>
    <span class="logo" title="DaVinci Teknoloji"></span>
    <h1>Subnet Hesaplayıcı</h1>
    <nav>
      <a href="index.html">Genel Bakış</a>
      <a href="sunucular.html">Sunucular</a>
      <a href="subnet.html" class="active">Subnet Hesaplama</a> <a href="kayitlar.html">Kayıtlar</a>
    </nav>
    <span id="saat" class="saat"></span>
  </header>
  <main>
    <div class="sn-kutu">
      <p class="sn-alt">IP adresi ve prefix gir, ağ bilgilerini hesapla.</p>
      <div class="sn-giris">
        <input id="ip" type="text" placeholder="192.168.1.10" value="192.168.1.10">
        <select id="prefix"></select>
        <button class="sn-hesapla" id="hesapla">Hesapla</button>
      </div>
      <div id="rozet"></div>
      <div id="sonuc"></div>
      <div class="sn-gecmis">
        <div class="sn-gecmis-baslik">
          <h3>Hesaplama Geçmişi</h3>
          <button class="sn-temizle" id="gecmisTemizle">Temizle</button>
        </div>
        <div id="gecmis"><p class="sn-bos">Yükleniyor…</p></div>
      </div>
    </div>
  </main>
  <script src="js/log.js"></script>
  <script src="js/app.js"></script>
  <script>
  const sel = document.getElementById('prefix');
  for (let i = 0; i <= 32; i++) {
    const o = document.createElement('option');
    o.value = i; o.textContent = '/' + i;
    if (i === 24) o.selected = true;
    sel.appendChild(o);
  }
  function ipToInt(ip) {
    const parts = ip.trim().split('.');
    if (parts.length !== 4) return null;
    let n = 0;
    for (const p of parts) {
      if (!/^\d+$/.test(p)) return null;
      const v = parseInt(p, 10);
      if (v < 0 || v > 255) return null;
      n = n * 256 + v;
    }
    return n >>> 0;
  }
  function intToIp(n) {
    return [(n>>>24)&255, (n>>>16)&255, (n>>>8)&255, n&255].join('.');
  }
  function ipSinifi(o) {
    if (o < 128) return 'A';
    if (o < 192) return 'B';
    if (o < 224) return 'C';
    if (o < 240) return 'D (multicast)';
    return 'E (deneysel)';
  }
  function ozelMi(ip) {
    const a = (ip>>>24)&255, b = (ip>>>16)&255;
    if (a === 10) return { tur:'ozel', ad:'Özel ağ (10.0.0.0/8)' };
    if (a === 172 && b >= 16 && b <= 31) return { tur:'ozel', ad:'Özel ağ (172.16.0.0/12)' };
    if (a === 192 && b === 168) return { tur:'ozel', ad:'Özel ağ (192.168.0.0/16)' };
    if (a === 127) return { tur:'ozel', ad:'Loopback (127.0.0.0/8)' };
    if (a === 169 && b === 254) return { tur:'ozel', ad:'Link-local (169.254.0.0/16)' };
    return { tur:'genel', ad:'Genel (public) adres' };
  }
  function hesapla() {
    const ip = ipToInt(document.getElementById('ip').value);
    const prefix = parseInt(document.getElementById('prefix').value, 10);
    const sonuc = document.getElementById('sonuc');
    const rozet = document.getElementById('rozet');
    if (ip === null) {
      rozet.innerHTML = '';
      sonuc.innerHTML = '<p class="sn-hata">Geçersiz IP adresi. Örnek: 192.168.1.10</p>';
      return;
    }
    const mask = prefix === 0 ? 0 : (0xFFFFFFFF << (32 - prefix)) >>> 0;
    const wildcard = (~mask) >>> 0;
    const network = (ip & mask) >>> 0;
    const broadcast = (network | wildcard) >>> 0;
    const total = Math.pow(2, 32 - prefix);
    let ilk, son, kullanilabilir;
    if (prefix === 32) { ilk = son = intToIp(ip); kullanilabilir = 1; }
    else if (prefix === 31) { ilk = intToIp(network); son = intToIp(broadcast); kullanilabilir = 2; }
    else { ilk = intToIp((network+1)>>>0); son = intToIp((broadcast-1)>>>0); kullanilabilir = total - 2; }
    const durum = ozelMi(ip);
    rozet.innerHTML = '<span class="sn-rozet '+durum.tur+'">'+durum.ad+'</span>';
    const satirlar = [
      ['Ağ adresi', intToIp(network) + '/' + prefix, true],
      ['Broadcast adresi', intToIp(broadcast), true],
      ['Alt ağ maskesi', intToIp(mask), true],
      ['Wildcard maskesi', intToIp(wildcard), true],
      ['İlk kullanılabilir host', ilk, true],
      ['Son kullanılabilir host', son, true],
      ['Kullanılabilir host sayısı', kullanilabilir.toLocaleString('tr-TR'), false],
      ['Toplam adres', total.toLocaleString('tr-TR'), false],
      ['IP sınıfı', ipSinifi((ip>>>24)&255), false],
    ];
    sonuc.innerHTML = satirlar.map(s => {
      const kopya = s[2] ? '<button class="sn-kopya" data-deger="'+s[1]+'">kopyala</button>' : '';
      return '<div class="sn-satir"><span class="sn-etiket">'+s[0]+'</span>'
           + '<span class="sn-sag"><span class="sn-deger">'+s[1]+'</span>'+kopya+'</span></div>';
    }).join('');
    document.querySelectorAll('.sn-kopya').forEach(btn => {
      btn.addEventListener('click', () => {
        const metin = btn.getAttribute('data-deger');
        const satir = btn.closest('.sn-satir');
        const baslik = satir ? satir.querySelector('.sn-etiket').textContent.trim() : 'Değer';
        navigator.clipboard.writeText(metin).then(() => {
          if (window.logYaz) logYaz('Değer kopyalandı', baslik + ': ' + metin);
          const eski = btn.textContent;
          btn.textContent = 'kopyalandı'; btn.classList.add('ok');
          setTimeout(() => { btn.textContent = eski; btn.classList.remove('ok'); }, 1200);
        }).catch(err => {
          if (window.logYaz) logYaz('Kopyalama başarısız', baslik + ': ' + metin + ' (tarayıcı panoya erişime izin vermedi)');
          btn.textContent = 'hata';
        });
      });
    });
  }
  // ---- Geçmiş: Supabase bulut veritabanı ----
  const SB_URL = 'https://ayxjajcymhqslanqkpqd.supabase.co/rest/v1/subnet_gecmis';
  const SB_KEY = 'sb_publishable_ZAzI-b38n2eGkgY97LnFOQ_dhe4XUrr'; // herkese açık (publishable) anahtar
  const SB_BASLIK = { 'apikey': SB_KEY, 'Content-Type': 'application/json' };
  let gecmisListe = [];

  function kacis(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  async function gecmisGetir() {
    const kutu = document.getElementById('gecmis');
    try {
      const r = await fetch(SB_URL + '?select=ip,prefix,ag,created_at&order=created_at.desc&limit=20', { headers: SB_BASLIK });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      gecmisListe = await r.json();
      gecmisGoster();
    } catch (e) {
      kutu.innerHTML = '<p class="sn-hata">Geçmiş yüklenemedi (bağlantı hatası).</p>';
    }
  }
  function gecmisGoster() {
    const kutu = document.getElementById('gecmis');
    if (!gecmisListe.length) { kutu.innerHTML = '<p class="sn-bos">Henüz kayıt yok.</p>'; return; }
    kutu.innerHTML = gecmisListe.map((k, i) =>
      '<div class="sn-kayit" data-i="'+i+'"><span>'+kacis(k.ip)+'/'+kacis(k.prefix)+' → '+kacis(k.ag)+'</span>'
      + '<span class="zaman">'+new Date(k.created_at).toLocaleString('tr-TR')+'</span></div>'
    ).join('');
    kutu.querySelectorAll('.sn-kayit').forEach(el => {
      el.addEventListener('click', () => {
        const k = gecmisListe[parseInt(el.getAttribute('data-i'), 10)];
        if (!k) return;
        document.getElementById('ip').value = k.ip;
        document.getElementById('prefix').value = k.prefix;
        hesapla();
      });
    });
  }
  async function gecmiseEkle() {
    const ipMetin = document.getElementById('ip').value.trim();
    const prefix = parseInt(document.getElementById('prefix').value, 10);
    const ip = ipToInt(ipMetin);
    if (ip === null) return; // geçersiz IP kaydedilmez
    if (gecmisListe.length && gecmisListe[0].ip === ipMetin && gecmisListe[0].prefix === prefix) return; // aynısı en üstteyse tekrar yazma
    const mask = prefix === 0 ? 0 : (0xFFFFFFFF << (32 - prefix)) >>> 0;
    const ag = intToIp((ip & mask) >>> 0) + '/' + prefix;
    try {
      const r = await fetch(SB_URL, { method: 'POST', headers: SB_BASLIK, body: JSON.stringify({ ip: ipMetin, prefix: prefix, ag: ag }) });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      gecmisGetir();
    } catch (e) { console.error('Kayıt eklenemedi:', e); }
  }
  document.getElementById('gecmisTemizle').addEventListener('click', async () => {
    if (!confirm('Tüm hesaplama geçmişi silinsin mi? (Bu işlem herkes için siler)')) {
      if (window.logYaz) logYaz('Buton tıklandı', 'Temizle (vazgeçildi)');
      return;
    }
    try {
      const r = await fetch(SB_URL + '?id=gt.0', { method: 'DELETE', headers: SB_BASLIK });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      if (window.logYaz) logYaz('Geçmiş temizlendi');
      gecmisGetir();
    } catch (e) { alert('Silme başarısız oldu.'); }
  });

  function hesaplaVeKaydet() {
    hesapla(); gecmiseEkle();
    if (window.logYaz) logYaz('Hesaplama', document.getElementById('ip').value.trim() + '/' + document.getElementById('prefix').value);
  }
  document.getElementById('hesapla').addEventListener('click', hesaplaVeKaydet);
  document.getElementById('ip').addEventListener('keydown', e => { if (e.key === 'Enter') hesaplaVeKaydet(); });
  gecmisGetir();
  hesapla();
  </script>
</body>
</html>
